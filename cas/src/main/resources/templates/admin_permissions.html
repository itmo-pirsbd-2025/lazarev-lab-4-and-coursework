<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <title>CAS — Права</title>
  <style>
    body { font-family: system-ui, Arial, sans-serif; margin: 24px; }
    .card { border: 1px solid #ddd; padding: 16px; border-radius: 12px; margin-bottom: 16px; }
    select, button { padding: 8px; margin-right: 8px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ddd; padding: 8px; }
    a { color: #1a73e8; }
  </style>
</head>
<body>
  <a href="/">← Назад</a>
  <h1>Админка — Права (RBAC)</h1>

  <div class="card">
    <form method="post" action="/admin/permissions">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <select name="serviceId" required>
        <option value="" disabled selected>Сервис</option>
        <option th:each="s : ${services}" th:value="${s.id}" th:text="${s.name + ' (' + s.host + ')'}"></option>
      </select>

      <select name="roleId" required>
        <option value="" disabled selected>Роль</option>
        <option th:each="r : ${roles}" th:value="${r.id}" th:text="${r.name}"></option>
      </select>

      <button type="submit">Выдать доступ</button>
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    </form>
  </div>

  <h2>Текущие permissions</h2>
  <table>
    <thead><tr><th>ServiceId</th><th>RoleId</th><th>Allow</th></tr></thead>
    <tbody>
      <tr th:each="p : ${perms}">
        <td th:text="${p.serviceId}"></td>
        <td th:text="${p.roleId}"></td>
        <td th:text="${p.allowAccess}"></td>
      </tr>
    </tbody>
  </table>
</body>
</html>
