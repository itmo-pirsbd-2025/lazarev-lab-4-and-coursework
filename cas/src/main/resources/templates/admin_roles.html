<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <title>CAS — Роли</title>
  <style>
    body { font-family: system-ui, Arial, sans-serif; margin: 24px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ddd; padding: 8px; }
    .card { border: 1px solid #ddd; padding: 16px; border-radius: 12px; margin-bottom: 16px; }
    input, button { padding: 8px; margin-right: 8px; }
    a { color: #1a73e8; }
  </style>
</head>
<body>
  <a href="/">← Назад</a>
  <h1>Админка — Роли</h1>

  <div class="card">
    <form method="post" action="/admin/roles">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <input name="name" placeholder="role name (например ADMIN)" required/>
      <button type="submit">Добавить роль</button>
    </form>
  </div>

  <h2>Текущие роли</h2>
  <table>
    <thead><tr><th>ID</th><th>Name</th><th>Действия</th></tr></thead>
    <tbody>
      <tr th:each="r : ${roles}">
        <td th:text="${r.id}"></td>
        <td th:text="${r.name}"></td>
        <td>
          <form th:action="'/admin/roles/' + ${r.id} + '/delete'" method="post" style="display:inline;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit">Удалить</button>
          </form>
        </td>
      </tr>
    </tbody>
  </table>
</body>
</html>
