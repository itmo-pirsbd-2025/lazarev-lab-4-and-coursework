<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <title>CAS — Сервисы</title>
  <style>
    body { font-family: system-ui, Arial, sans-serif; margin: 24px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ddd; padding: 8px; }
    .card { border: 1px solid #ddd; padding: 16px; border-radius: 12px; margin-bottom: 16px; }
    input { padding: 8px; margin-right: 8px; }
    button { padding: 8px 10px; }
    a { color: #1a73e8; }
  </style>
</head>
<body>
  <a href="/">← Назад</a>
  <h1>Админка — Сервисы</h1>

  <div class="card">
    <form method="post" action="/admin/services">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <input name="name" placeholder="Название (например Grafana)" required />
      <input name="host" placeholder="host (например grafana.localtest.me)" required />
      <button type="submit">Добавить</button>
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    </form>
  </div>

  <table>
    <thead>
      <tr>
        <th>ID</th><th>Название</th><th>Host</th><th>Enabled</th><th>Действие</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="s : ${services}">
        <td th:text="${s.id}"></td>
        <td th:text="${s.name}"></td>
        <td th:text="${s.host}"></td>
        <td th:text="${s.enabled}"></td>
        <td>
          <form th:action="'/admin/services/' + ${s.id} + '/toggle'" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" th:text="${s.enabled} ? 'Disable' : 'Enable'"></button>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          </form>
        </td>
      </tr>
    </tbody>
  </table>
</body>
</html>
